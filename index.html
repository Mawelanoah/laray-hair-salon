<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | Perfect Beauty Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root { --bg:#f5f2ef; --card:#fff; --ink:#1f1a17; --muted:#7a7068; --line:#e8e0d8; --accent:#a88472; --ok:#2d6a4f; --err:#9b2226; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:Jost,system-ui,sans-serif; background:var(--bg); color:var(--ink); font-size:15px; }
a { color:inherit; text-decoration:none; }
button, input, select, textarea { font-family:inherit; font-size:0.95rem; }
.hidden { display:none !important; }

/* Login */
.login-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1.5rem; }
.login-card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:2rem; width:100%; max-width:380px; }
.login-card h1 { font-size:1.4rem; margin-bottom:0.35rem; }
.login-card p { color:var(--muted); margin-bottom:1.5rem; font-size:0.9rem; }
.field { margin-bottom:1rem; }
.field label { display:block; font-size:0.75rem; font-weight:500; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted); margin-bottom:0.35rem; }
.field input { width:100%; min-height:46px; padding:0.6rem 0.9rem; border:1px solid var(--line); border-radius:10px; background:#fff; }
.btn { display:inline-flex; align-items:center; justify-content:center; min-height:46px; padding:0.6rem 1.25rem; border:none; border-radius:999px; font-weight:500; cursor:pointer; }
.btn-primary { background:var(--ink); color:#fff; width:100%; }
.btn-primary:hover { background:var(--accent); }
.btn-sm { min-height:36px; padding:0.4rem 0.9rem; font-size:0.8rem; }
.btn-ghost { background:transparent; border:1px solid var(--line); }
.err { background:#fde8e8; color:var(--err); padding:0.7rem 0.9rem; border-radius:10px; margin-bottom:1rem; font-size:0.9rem; }

/* Shell */
.shell { display:grid; grid-template-columns:220px 1fr; min-height:100vh; }
@media (max-width:800px) { .shell { grid-template-columns:1fr; } .sidebar { display:none; } .sidebar.open { display:block; position:fixed; inset:0; z-index:50; } }
.sidebar { background:var(--ink); color:rgba(255,255,255,0.8); padding:1.5rem 1rem; }
.sidebar h2 { color:#fff; font-size:1rem; margin-bottom:1.5rem; }
.sidebar a { display:block; padding:0.65rem 0.85rem; border-radius:8px; margin-bottom:0.25rem; font-size:0.9rem; }
.sidebar a:hover, .sidebar a.active { background:rgba(255,255,255,0.1); color:#fff; }
.main { padding:1.5rem; }
.topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem; flex-wrap:wrap; gap:0.75rem; }
.topbar h1 { font-size:1.35rem; }
.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:0.85rem; margin-bottom:1.5rem; }
.stat { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:1.1rem; }
.stat__n { font-size:1.75rem; font-weight:600; }
.stat__l { font-size:0.8rem; color:var(--muted); }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:1.15rem; margin-bottom:1rem; }
table { width:100%; border-collapse:collapse; font-size:0.88rem; }
th, td { text-align:left; padding:0.65rem 0.5rem; border-bottom:1px solid var(--line); }
th { font-size:0.72rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); }
.badge { display:inline-block; padding:0.2rem 0.55rem; border-radius:999px; font-size:0.72rem; font-weight:500; }
.badge-confirmed { background:#d8f3dc; color:var(--ok); }
.badge-cancelled { background:#fde8e8; color:var(--err); }
.badge-pending { background:#fff3cd; color:#856404; }
.filters { display:flex; flex-wrap:wrap; gap:0.5rem; margin-bottom:1rem; }
.filters input, .filters select { min-height:40px; padding:0.4rem 0.75rem; border:1px solid var(--line); border-radius:8px; background:#fff; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-view" class="login-wrap">
  <div class="login-card">
    <h1>Salon Admin</h1>
    <p>Perfect Beauty Studio booking dashboard</p>
    <div id="login-err" class="err hidden"></div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="login-email" value="admin@perfectbeautystudio.co.za" autocomplete="username">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="login-password" value="admin123" autocomplete="current-password">
    </div>
    <button class="btn btn-primary" id="login-btn">Sign in</button>
    <p style="margin-top:1rem;font-size:0.8rem;color:var(--muted);">Default: admin@perfectbeautystudio.co.za / admin123 — change after first login.</p>
  </div>
</div>

<!-- DASHBOARD -->
<div id="app-view" class="shell hidden">
  <aside class="sidebar">
    <h2>PBS Admin</h2>
    <a href="#" data-view="dashboard" class="active">Dashboard</a>
    <a href="#" data-view="appointments">Appointments</a>
    <a href="#" data-view="services">Services</a>
    <a href="#" data-view="professionals">Professionals</a>
    <a href="#" id="logout-btn" style="margin-top:2rem;opacity:0.6;">Sign out</a>
  </aside>
  <div class="main">
    <div class="topbar">
      <h1 id="view-title">Dashboard</h1>
      <a href="/" class="btn btn-sm btn-ghost" target="_blank">View website</a>
    </div>
    <div id="view-content"></div>
  </div>
</div>

<script>
(function () {
  var token = localStorage.getItem('pbs_token') || '';
  var API = '';

  function api(path, opts) {
    opts = opts || {};
    return fetch(API + path, {
      method: opts.method || 'GET',
      headers: Object.assign(
        { 'Content-Type': 'application/json' },
        token ? { Authorization: 'Bearer ' + token } : {},
        opts.headers || {}
      ),
      body: opts.body ? JSON.stringify(opts.body) : undefined
    }).then(function (r) {
      return r.json().then(function (d) {
        if (!r.ok) throw new Error(d.error || 'Request failed');
        return d;
      });
    });
  }

  function showLogin() {
    document.getElementById('login-view').classList.remove('hidden');
    document.getElementById('app-view').classList.add('hidden');
  }
  function showApp() {
    document.getElementById('login-view').classList.add('hidden');
    document.getElementById('app-view').classList.remove('hidden');
    loadView('dashboard');
  }

  document.getElementById('login-btn').onclick = function () {
    var err = document.getElementById('login-err');
    err.classList.add('hidden');
    api('/api/admin/login', {
      method: 'POST',
      body: {
        email: document.getElementById('login-email').value,
        password: document.getElementById('login-password').value
      }
    }).then(function (d) {
      token = d.token;
      localStorage.setItem('pbs_token', token);
      showApp();
    }).catch(function (e) {
      err.textContent = e.message;
      err.classList.remove('hidden');
    });
  };

  document.getElementById('logout-btn').onclick = function (e) {
    e.preventDefault();
    token = '';
    localStorage.removeItem('pbs_token');
    showLogin();
  };

  document.querySelectorAll('.sidebar a[data-view]').forEach(function (a) {
    a.onclick = function (e) {
      e.preventDefault();
      document.querySelectorAll('.sidebar a').forEach(function (x) { x.classList.remove('active'); });
      a.classList.add('active');
      loadView(a.dataset.view);
    };
  });

  function loadView(name) {
    document.getElementById('view-title').textContent = name.charAt(0).toUpperCase() + name.slice(1);
    var el = document.getElementById('view-content');
    el.innerHTML = '<p style="color:var(--muted)">Loading…</p>';
    if (name === 'dashboard') {
      api('/api/admin/dashboard').then(function (d) {
        el.innerHTML =
          '<div class="stats">' +
          stat(d.today, "Today's appointments") +
          stat(d.upcoming, 'Upcoming') +
          stat(d.total, 'Total bookings') +
          stat(d.cancelled, 'Cancelled') +
          '</div><div class="card"><h3 style="margin-bottom:0.75rem;font-size:1rem;">Recent bookings</h3>' +
          apptTable(d.recent || []) + '</div>';
      }).catch(function (e) { el.innerHTML = '<p class="err">' + e.message + '</p>'; });
    } else if (name === 'appointments') {
      api('/api/admin/appointments').then(function (d) {
        el.innerHTML = '<div class="card">' + apptTable(d.appointments || [], true) + '</div>';
        bindStatusButtons();
      }).catch(function (e) { el.innerHTML = '<p class="err">' + e.message + '</p>'; });
    } else if (name === 'services') {
      api('/api/admin/services').then(function (d) {
        var rows = (d.services || []).map(function (s) {
          return '<tr><td>' + s.category + '</td><td>' + s.name + '</td><td>R' + s.price + '</td><td>' + s.duration + ' min</td><td>' + (s.active ? 'Active' : 'Off') + '</td></tr>';
        }).join('');
        el.innerHTML = '<div class="card"><table><thead><tr><th>Category</th><th>Name</th><th>Price</th><th>Duration</th><th>Status</th></tr></thead><tbody>' + rows + '</tbody></table><p style="margin-top:1rem;color:var(--muted);font-size:0.85rem;">Edit prices and options via API or extend this panel. Services are managed in the database.</p></div>';
      }).catch(function (e) { el.innerHTML = '<p class="err">' + e.message + '</p>'; });
    } else if (name === 'professionals') {
      api('/api/admin/professionals').then(function (d) {
        var rows = (d.professionals || []).map(function (p) {
          return '<tr><td>' + p.name + '</td><td>' + (p.role || '') + '</td><td>' + (p.active ? 'Active' : 'Off') + '</td></tr>';
        }).join('');
        el.innerHTML = '<div class="card"><table><thead><tr><th>Name</th><th>Role</th><th>Status</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
      }).catch(function (e) { el.innerHTML = '<p class="err">' + e.message + '</p>'; });
    }
  }

  function stat(n, l) {
    return '<div class="stat"><div class="stat__n">' + n + '</div><div class="stat__l">' + l + '</div></div>';
  }

  function apptTable(list, withActions) {
    if (!list.length) return '<p style="color:var(--muted)">No appointments yet.</p>';
    var head = '<table><thead><tr><th>Ref</th><th>Date</th><th>Time</th><th>Customer</th><th>Service</th><th>Pro</th><th>Status</th>' + (withActions ? '<th></th>' : '') + '</tr></thead><tbody>';
    var body = list.map(function (a) {
      var badge = '<span class="badge badge-' + a.status + '">' + a.status + '</span>';
      var actions = withActions
        ? '<td><button class="btn btn-sm btn-ghost status-btn" data-id="' + a.appointment_id + '" data-status="cancelled">Cancel</button> <button class="btn btn-sm btn-ghost status-btn" data-id="' + a.appointment_id + '" data-status="completed">Done</button></td>'
        : '';
      return '<tr><td>' + (a.booking_reference || '') + '</td><td>' + a.date + '</td><td>' + a.start_time + '</td><td>' + (a.customer_name || '') + '<br><small>' + (a.customer_phone || '') + '</small></td><td>' + (a.service_name || '') + '</td><td>' + (a.professional_name || '') + '</td><td>' + badge + '</td>' + actions + '</tr>';
    }).join('');
    return head + body + '</tbody></table>';
  }

  function bindStatusButtons() {
    document.querySelectorAll('.status-btn').forEach(function (btn) {
      btn.onclick = function () {
        api('/api/admin/appointments/' + btn.dataset.id, {
          method: 'PATCH',
          body: { status: btn.dataset.status }
        }).then(function () { loadView('appointments'); })
          .catch(function (e) { alert(e.message); });
      };
    });
  }

  // Auto-login if token present
  if (token) {
    api('/api/admin/dashboard').then(showApp).catch(function () {
      token = '';
      localStorage.removeItem('pbs_token');
      showLogin();
    });
  }
})();
</script>
</body>
</html>
